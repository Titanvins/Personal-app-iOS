name: IdeaBox
options:
  bundleIdPrefix: com.vincenzo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Inserisci il tuo Team ID Apple per firmare l'app
    DEVELOPMENT_TEAM: ""
targets:
  IdeaBox:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincenzo.ideabox
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: App/IdeaBox.entitlements
      properties:
        com.apple.security.application-groups: [group.com.vincenzo.ideabox]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Idee
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Serve per registrare le tue note vocali.
        NSSpeechRecognitionUsageDescription: Serve per trascrivere le note vocali in testo.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincenzo.ideabox.share
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.vincenzo.ideabox]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Salva in Idee
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
